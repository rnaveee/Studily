spring.application.name=Studily

server.port=${PORT:8080}
server.forward-headers-strategy=framework
server.shutdown=graceful
spring.lifecycle.timeout-per-shutdown-phase=25s
spring.task.scheduling.pool.size=4

spring.datasource.url=jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:studily}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.jpa.properties.hibernate.jdbc.time_zone=UTC
spring.jpa.properties.hibernate.default_batch_fetch_size=50

spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1

app.jwt.secret=${JWT_SECRET:dev-only-insecure-secret-DO-NOT-USE-IN-PROD-set-JWT_SECRET-env-var}
app.jwt.expiration-ms=${JWT_EXPIRATION_MS:2592000000}

app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}

app.admin.username=${ADMIN_USERNAME:}
app.admin.totp-secret=${ADMIN_TOTP_SECRET:}
app.admin.token-secret=${ADMIN_TOKEN_SECRET:}
app.admin.session-ms=${ADMIN_SESSION_MS:1800000}

app.feeds.encryption-key=${FEED_ENCRYPTION_KEY:}
app.feeds.stale-after-hours=${FEED_STALE_AFTER_HOURS:6}
app.feeds.sync-delay-ms=${FEED_SYNC_DELAY_MS:600000}
app.feeds.sync-initial-delay-ms=${FEED_SYNC_INITIAL_DELAY_MS:120000}

app.timezone=${APP_TIMEZONE:America/Toronto}

app.push.vapid.public-key=${VAPID_PUBLIC_KEY:}
app.push.vapid.private-key=${VAPID_PRIVATE_KEY:}
app.push.vapid.subject=${VAPID_SUBJECT:mailto:ryannave97@gmail.com}

app.mail.resend-api-key=${RESEND_API_KEY:}
app.mail.from=${MAIL_FROM:Studily <onboarding@resend.dev>}
app.support.email=${SUPPORT_EMAIL:ryannave97@gmail.com}
app.base-url=${APP_BASE_URL:http://localhost:5173}
app.spa.pages=classpath:/static/prerender/

app.survey.open=${SURVEY_OPEN:true}

app.progress.badge-base-url=${BADGE_ASSET_BASE_URL:https://badges.studily.ca/badges/v4}
app.progress.og-cutoff=${PROGRESS_OG_CUTOFF:2026-10-11}
app.progress.flair-base-url=${FLAIR_ASSET_BASE_URL:https://badges.studily.ca/flairs/v1}

spring.servlet.multipart.max-file-size=25MB
spring.servlet.multipart.max-request-size=50MB

management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never

app.sentry.dsn=${SENTRY_DSN:}
app.sentry.environment=${SENTRY_ENVIRONMENT:development}
app.sentry.traces-sample-rate=${SENTRY_TRACES_SAMPLE_RATE:0.2}

app.parse.enabled=${PARSE_ENABLED:true}
app.parse.api-key=${ANTHROPIC_API_KEY:}
app.parse.model.text=${PARSE_MODEL_TEXT:claude-sonnet-5}
app.parse.model.vision=${PARSE_MODEL_VISION:claude-sonnet-5-5}
app.parse.monthly-limit=${PARSE_MONTHLY_LIMIT:10}
app.parse.daily-budget-usd=${PARSE_DAILY_BUDGET_USD:0.5}
app.parse.monthly-budget-usd=${PARSE_MONTHLY_BUDGET_USD:2}
app.parse.quota-reset-at=${PARSE_QUOTA_RESET_AT:}

app.flashcards.gen.enabled=${FLASHCARD_GEN_ENABLED:true}
app.flashcards.gen.model=${FLASHCARD_GEN_MODEL:claude-haiku-5-5}
app.flashcards.gen.monthly-limit=${FLASHCARD_GEN_MONTHLY_LIMIT:20}
app.flashcards.gen.daily-budget-usd=${FLASHCARD_GEN_DAILY_BUDGET_USD:0.75}
app.flashcards.gen.monthly-budget-usd=${FLASHCARD_GEN_MONTHLY_BUDGET_USD:8}

app.feynman.enabled=${FEYNMAN_ENABLED:true}
app.feynman.analyzer-model=${FEYNMAN_ANALYZER_MODEL:claude-sonnet-5-5}
app.feynman.tutor-model=${FEYNMAN_TUTOR_MODEL:claude-haiku-5-5}
app.feynman.daily-turns=${FEYNMAN_DAILY_TURNS:150}
app.feynman.daily-budget-usd=${FEYNMAN_DAILY_BUDGET_USD:2}
app.feynman.monthly-budget-usd=${FEYNMAN_MONTHLY_BUDGET_USD:15}

app.storage.endpoint=${STORAGE_ENDPOINT:}
app.storage.bucket=${STORAGE_BUCKET:studily-files}
app.storage.access-key=${STORAGE_ACCESS_KEY:}
app.storage.secret-key=${STORAGE_SECRET_KEY:}
app.storage.local-dir=${STORAGE_LOCAL_DIR:}

app.bank.max-file-bytes=${BANK_MAX_FILE_BYTES:26214400}
app.bank.max-files-per-request=${BANK_MAX_FILES_PER_REQUEST:10}
app.bank.max-files-per-user=${BANK_MAX_FILES_PER_USER:300}
app.bank.quota-bytes=${BANK_QUOTA_BYTES:1073741824}
app.bank.max-pages=${BANK_MAX_PAGES:500}
app.bank.max-chunks-per-scope=${BANK_MAX_CHUNKS_PER_SCOPE:6000}

app.rag.voyage.api-key=${VOYAGE_API_KEY:}
app.rag.voyage.base-url=${VOYAGE_BASE_URL:https://api.voyageai.com}
app.rag.voyage.embed-model=${VOYAGE_EMBED_MODEL:voyage-4}
app.rag.voyage.rerank-model=${VOYAGE_RERANK_MODEL:rerank-3}
app.rag.rewrite-model=${RAG_REWRITE_MODEL:claude-haiku-5-5}
app.rag.min-relevance=${RAG_MIN_RELEVANCE:0.2}
app.rag.embeddings-monthly-budget-usd=${RAG_EMBEDDINGS_MONTHLY_BUDGET_USD:2}

app.bot.enabled=${STUDILYBOT_ENABLED:true}
app.bot.chat.model=${BOT_CHAT_MODEL:claude-haiku-5-5}
app.bot.chat.max-tokens=${BOT_CHAT_MAX_TOKENS:2048}
app.bot.chat.vision-model=${BOT_CHAT_VISION_MODEL:claude-sonnet-5-5}
app.bot.chat.max-image-bytes=${BOT_CHAT_MAX_IMAGE_BYTES:5242880}
app.bot.chat.daily-turns=${BOT_CHAT_DAILY_TURNS:100}
app.bot.chat.daily-budget-usd=${BOT_CHAT_DAILY_BUDGET_USD:1}
app.bot.chat.monthly-budget-usd=${BOT_CHAT_MONTHLY_BUDGET_USD:5}
app.bot.practice.problem-model=${BOT_PRACTICE_PROBLEM_MODEL:claude-sonnet-5-5}
app.bot.practice.grade-model=${BOT_PRACTICE_GRADE_MODEL:claude-haiku-5-5}
app.bot.practice.vision-model=${BOT_PRACTICE_VISION_MODEL:claude-sonnet-5-5}
app.bot.practice.daily-turns=${BOT_PRACTICE_DAILY_TURNS:80}
app.bot.practice.daily-budget-usd=${BOT_PRACTICE_DAILY_BUDGET_USD:1}
app.bot.practice.monthly-budget-usd=${BOT_PRACTICE_MONTHLY_BUDGET_USD:5}
app.bot.practice.max-photo-bytes=${BOT_PRACTICE_MAX_PHOTO_BYTES:8388608}
