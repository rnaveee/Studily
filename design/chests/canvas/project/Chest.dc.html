<script type="text/x-dc" data-dc-script data-props='{"tier":{"editor":"enum","options":["WOOD","SILVER","GOLD","DIAMOND"],"default":"GOLD"},"state":{"editor":"enum","options":["closed","shaking","open"],"default":"closed"},"size":{"editor":"int","min":40,"max":1024,"default":512},"animate":{"editor":"boolean","default":true},"$preview":{"width":512,"height":512}}'>
const CHEST_TIERS = {
  WOOD: { name: 'Wooden chest', L: '#C99A66', B: '#A26F40', D: '#7A4F2A', X: '#573619', H: '#E2C29A', tL: '#A8A4BE', tB: '#77738F', tD: '#504C68', tH: '#D6D3E6', in: '#2E1C0C', glow: '#FFD27A', gem: '#4CB8F0', sparkles: 0 },
  SILVER: { name: 'Silver chest', L: '#F4F7FB', B: '#CBD3DE', D: '#98A3B4', X: '#677285', H: '#FFFFFF', tL: '#8FB0D6', tB: '#5D7FA8', tD: '#3E5C82', tH: '#C7DAF0', in: '#232A3A', glow: '#CDEBFF', gem: '#4CB8F0', sparkles: 1 },
  GOLD: { name: 'Gold chest', L: '#FFE57F', B: '#F7C531', D: '#D49A10', X: '#9C6A04', H: '#FFF7C9', tL: '#9C8CFF', tB: '#6F5CE0', tD: '#4E3DB8', tH: '#C9C0FF', in: '#3A2600', glow: '#FFE27A', gem: '#E22B4C', sparkles: 3 },
  DIAMOND: { name: 'Diamond chest', L: '#E6FBFF', B: '#A3E8FF', D: '#5EC6EC', X: '#2B8FC2', H: '#FFFFFF', tL: '#FFFFFF', tB: '#DCE6F2', tD: '#AFC0D6', tH: '#FFFFFF', in: '#0F4F73', glow: '#9FF0FF', gem: null, sparkles: 4 }
};
class Component extends DCLogic {
  renderVals() {
    if (!this._uid) this._uid = 'c' + Math.random().toString(36).slice(2, 9);
    const uid = this._uid;
    const tier = CHEST_TIERS[this.props.tier] ? this.props.tier : 'GOLD';
    const c = CHEST_TIERS[tier];
    const state = this.props.state === 'open' || this.props.state === 'shaking' ? this.props.state : 'closed';
    const animate = this.props.animate !== false && this.props.animate !== 'false';
    const size = Number(this.props.size) || 512;
    const on = (b) => (b ? 'inline' : 'none');
    const open = state === 'open';
    return {
      uid,
      c,
      px: size + 'px',
      label: c.name + (open ? ', open' : ', closed'),
      svgClass: 'ch-svg' + (animate ? '' : ' ch-still'),
      rootClass: state === 'shaking' ? 'ch-shake' : open ? 'ch-pop' : 'ch-bob',
      openDisp: on(open),
      closedDisp: on(!open),
      keyDisp: on(tier === 'WOOD'),
      gemDisp: on(tier !== 'WOOD'),
      gemFill: c.gem || 'url(#gR' + uid + ')',
      t: {
        wood: on(tier === 'WOOD'),
        metal: on(tier !== 'WOOD' && tier !== 'DIAMOND'),
        silver: on(tier === 'SILVER'),
        gold: on(tier === 'GOLD'),
        diamond: on(tier === 'DIAMOND')
      },
      sp1: on(c.sparkles >= 1),
      sp2: on(c.sparkles >= 2),
      sp3: on(c.sparkles >= 3),
      sp4: on(c.sparkles >= 4)
    };
  }
}
</script>
