<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <title>Mobile preview</title>
    <style>
      body { margin: 0; padding: 12px; background: #222; font: 12px system-ui; color: #ccc; display: flex; gap: 12px; }
      figure { margin: 0; }
      figcaption { padding: 4px 0; }
      iframe { border: 1px solid #555; background: #fff; }
      .phone { width: 390px; height: 600px; }
      .desktop { width: 820px; height: 600px; }
    </style>
  </head>
  <body>
    <figure><figcaption>/calendar &mdash; 390px</figcaption><iframe class="phone" src="/calendar"></iframe></figure>
    <figure><figcaption>/calendar &mdash; 820px</figcaption><iframe class="desktop" src="/calendar"></iframe></figure>
  </body>
</html>
